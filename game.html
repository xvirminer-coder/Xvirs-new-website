<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orb Clicker - Idle Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="game-container">
        <!-- Top Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Total Orbs</div>
                <div class="stat-value" id="totalOrbs">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Per Click</div>
                <div class="stat-value" id="orbsPerClick">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">Per Second</div>
                <div class="stat-value" id="orbsPerSecond">0</div>
            </div>
            <button id="saveBtn" class="save-btn">💾 Save</button>
            <button id="resetBtn" class="reset-btn">🔄 Reset</button>
        </div>

        <!-- Main Game Area -->
        <div class="game-area">
            <!-- Left Panel - Click Upgrades -->
            <div class="panel upgrades-panel">
                <h2>Click Power</h2>
                <div id="clickUpgradesContainer" class="upgrades-list"></div>
            </div>

            <!-- Center - Clicker -->
            <div class="clicker-area">
                <div class="orb-container">
                    <div id="orbClickable" class="orb"></div>
                    <div id="floatingNumbers"></div>
                </div>
                <div id="clicksPerSec" class="cps-display">0 clicks/sec</div>
            </div>

            <!-- Right Panel - Generators -->
            <div class="panel generators-panel">
                <h2>Generators</h2>
                <div id="generatorsContainer" class="upgrades-list"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
